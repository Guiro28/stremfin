<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stremfin · Connecter un appareil</title>
<link rel="icon" type="image/svg+xml" href="/stremfin/ui/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/stremfin/ui/icon-192.png">
<link rel="apple-touch-icon" href="/stremfin/ui/apple-touch-icon.png">
<meta name="theme-color" content="#0b1020">
<script src="/stremfin/ui/prefs.js"></script>
<link rel="stylesheet" href="/stremfin/ui/style.css">
<style>
  .pin-input { font-family: var(--mono); font-size: 34px; letter-spacing: .35em; text-align: center; padding: 14px 10px 14px 22px; }
  .done { text-align: center; }
  .done .check { width: 56px; height: 56px; border-radius: 50%; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; margin: 0 auto 12px; }
  .done .check svg { width: 28px; height: 28px; stroke: currentColor; fill: none; stroke-width: 2.4; }
  .who { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--input); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; }
</style>
</head>
<body>
<div class="auth">
  <div class="card stack" id="box">
    <div class="brand"><div class="brand-logo"><img src="/stremfin/ui/icon.svg" alt=""></div><div class="brand-name">Stremfin</div></div>
    <div id="view"></div>
    <div class="auth-tools" id="tools"></div>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="pin.js"></script>
</body>
</html>
